<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechOrient AI</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1b2238;--m:#5d667d;--a:#3b5bdb;--b:#dfe3ee}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.5rem;margin:.2em 0}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:12px 0}
.bar{height:8px;background:var(--b);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
button{font:inherit;background:var(--a);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}button.s{background:#fff;color:var(--a);border:1px solid var(--a)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--b)}select{font:inherit;padding:6px;max-width:55%}
.m{color:var(--m);font-size:.9rem}.nav{display:flex;gap:8px;justify-content:space-between;margin-top:12px}.tag{font-size:.8rem;background:#eef1ff;color:var(--a);border-radius:6px;padding:2px 8px}
table{border-collapse:collapse;font-size:.8rem}td,th{border:1px solid var(--b);padding:4px 6px;text-align:left}textarea,input{font:inherit}
select,input{min-height:40px}
@media print{.card{break-inside:avoid}.nav,button{display:none}body{background:#fff}}
</style></head><body><main id="app"></main>
<script src="domains.js"></script><script src="recommendation.js"></script><script src="app.js"></script></body></html>
